<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LAVA SHÓP SYSTEM</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0;
            background-color: #05050a; 
            color: #00e5ff; 
            font-family: 'Segoe UI', sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }

        /* --- หน้า Loading --- */
        #loader-screen { text-align: center; width: 80%; }
        .title-neon { font-size: 22px; font-weight: bold; margin-bottom: 30px; text-shadow: 0 0 10px #00e5ff; }
        .progress-bar { width: 100%; height: 4px; background: #111; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: #00e5ff; box-shadow: 0 0 15px #00e5ff; transition: width 0.1s linear; }

        /* --- หน้าพาแนลสีฟ้าที่พี่ต้องการ --- */
        #panel-screen {
            display: none; 
            width: 100%; height: 100%;
            flex-direction: column; align-items: center; justify-content: center;
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .panel-header {
            font-size: 24px; font-weight: bold;
            border-bottom: 2px solid #00e5ff;
            padding-bottom: 10px; margin-bottom: 30px;
            width: 90%; text-align: center;
        }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 90%; max-width: 400px; }
        .btn-blue {
            background: transparent; color: #00e5ff; border: 1px solid #00e5ff;
            padding: 20px; border-radius: 8px; font-weight: bold;
            box-shadow: inset 0 0 5px #00e5ff;
        }
        .btn-blue:active { background: #00e5ff; color: #000; }
    </style>
</head>
<body>

    <div id="loader-screen">
        <div class="title-neon">LAVA SHÓP SYSTEM</div>
        <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
    </div>

    <div id="panel-screen">
        <div class="panel-header">LAVA SHÓP SYSTEM</div>
        <div class="btn-grid">
            <button class="btn-blue">SET DNS</button>
            <button class="btn-blue">OPTIMIZE</button>
            <button class="btn-blue">BYPASS</button>
            <button class="btn-blue">SETTINGS</button>
        </div>
    </div>

    <script>
        const fill = document.getElementById('fill');
        let width = 0;
        const loadInterval = setInterval(() => {
            width++;
            fill.style.width = width + '%';
            if (width >= 100) {
                clearInterval(loadInterval);
                setTimeout(() => {
                    document.getElementById('loader-screen').style.display = 'none';
                    document.getElementById('panel-screen').style.display = 'flex';
                }, 400);
            }
        }, 60); // ความเร็วนี้ผมตั้งไว้ให้แล้ว ไม่ต้องแก้ครับ
    </script>
</body>
</html>
