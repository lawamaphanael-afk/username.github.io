<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LAVA SHÓP SYSTEM</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f0c1d;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #loader-container {
            text-align: center;
            width: 80%;
            max-width: 400px;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            color: #00e5ff;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #1a1a2e;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        .status-text {
            margin-top: 15px;
            font-size: 14px;
            color: #888;
        }

        /* หน้าหลักหลังจากโหลดเสร็จ */
        #main-content {
            display: none;
            text-align: center;
            animation: fadeIn 1s ease-in;
        }

        .success-icon {
            font-size: 60px;
            color: #00ff88;
            margin-bottom: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="loader-container">
        <div class="title">LAVA SHÓP SYSTEM</div>
        <div class="progress-bar">
            <div class="progress-fill" id="fill"></div>
        </div>
        <div class="status-text" id="status">Checking credentials...</div>
    </div>

    <div id="main-content">
        <div class="success-icon">✓</div>
        <div class="title" style="color: #00ff88;">SYSTEM READY</div>
        <p style="color: #ccc;">DNS and Profile Installed Successfully.</p>
        <button onclick="location.reload()" style="background: #0072ff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">RECHECK</button>
    </div>

    <script>
        let fill = document.getElementById('fill');
        let status = document.getElementById('status');
        let loader = document.getElementById('loader-container');
        let main = document.getElementById('main-content');
        
        let width = 0;
        let messages = [
            "Checking credentials...",
            "Encrypting DNS...",
            "Optimizing connection...",
            "Finalizing setup..."
        ];

        // ฟังก์ชันโหลดแถบพลัง
        let interval = setInterval(() => {
            if (width >= 100) {
                clearInterval(interval);
                // เมื่อเต็ม 100% ให้เปลี่ยนหน้า
                loader.style.display = 'none';
                main.style.display = 'block';
            } else {
                width++;
                fill.style.width = width + '%';
                
                // สุ่มเปลี่ยนข้อความตามเปอร์เซ็นต์
                if(width == 30) status.innerText = messages[1];
                if(width == 60) status.innerText = messages[2];
                if(width == 90) status.innerText = messages[3];
            }
        }, 50); // ความเร็วในการโหลด (50ms ต่อ 1%)
    </script>
</body>
</html>
